<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="pp-preview-404-router">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Page not found</title>
<script>
(async () => {
  const base = '/packing-panic-preview/';
  const rest = location.pathname.startsWith(base) ? location.pathname.slice(base.length).split('/').filter(Boolean) : [];
  const tries = [];
  for (let n = Math.min(2, rest.length); n > 0; n--) tries.push(base + rest.slice(0, n).join('/') + '/404.html');
  tries.push(base + '404-main.html');
  for (const url of tries) {
    try {
      const res = await fetch(url);
      if (res.ok) { const html = await res.text(); document.open(); document.write(html); document.close(); return; }
    } catch (e) { /* try the next one */ }
  }
  document.body.textContent = 'Page not found';
})();
</script></head><body></body></html>
